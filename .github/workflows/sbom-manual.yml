name: sbom-manual

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: "対象ディレクトリ(例: . や services/api)"
        required: true
        default: "."

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action/download-syft@v0
      - run: syft "dir:${{ inputs.target_path }}" -o cyclonedx-json=sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
